site_name: Volcano Hybrid examples
site_description: Dashboards, scripts and automations for the Storz & Bickel Home Assistant integration
site_url: https://savagenl.github.io/home-assistant-volcano-hybrid/
repo_url: https://github.com/SavageNL/home-assistant-volcano-hybrid
repo_name: SavageNL/home-assistant-volcano-hybrid
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Dashboards: dashboards.md
  - Scripts:
      - scripts/fill-a-bag.md
      - scripts/bag-session.md
      - scripts/whip-session.md
      - scripts/party-rounds.md
  - Automations:
      - automations/temperature-progression.md
      - automations/temperature-steps.md
  - Presets: presets.md

theme:
  name: material
  icon:
    logo: material/volcano-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.footer
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
