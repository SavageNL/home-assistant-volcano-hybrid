name: Publish Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Every value below reaches the scripts through env rather than ${{ }}
      # interpolation: interpolated text becomes part of the script itself, so
      # a tag name (or dispatch input) containing $(...) would run as code.
      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-alpha* || "$version" == *-beta* || "$version" == *-rc* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into manifest and build zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest="custom_components/volcano_hybrid/manifest.json"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$tmp"
          mv "$tmp" "$manifest"
          cd custom_components/volcano_hybrid
          zip -r "$GITHUB_WORKSPACE/volcano_hybrid.zip" . -x '*__pycache__*' '*.pyc'

      - name: Extract release notes from the changelog
        id: notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          # The notes are whatever has accumulated under "## [Unreleased]",
          # so releasing stays a single tag push with no version to pre-set.
          awk '
            index($0, "## [Unreleased]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            echo "file=$notes" >> "$GITHUB_OUTPUT"
          else
            # Warn rather than fail: the tag already points at this commit, so
            # failing here could not be fixed by editing the changelog later.
            echo "::warning::No entries under '## [Unreleased]' in" \
              "CHANGELOG.md; publishing with auto-generated notes only."
          fi

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # A --notes-file body is pre-pended to the generated notes, so the
          # curated entries lead and the commit list follows.
          extra_args=()
          if [ -n "$NOTES_FILE" ]; then
            extra_args+=(--notes-file "$NOTES_FILE")
          fi
          if [ -n "$PRERELEASE" ]; then
            extra_args+=("$PRERELEASE")
          fi
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/volcano_hybrid.zip" \
            --title "v$VERSION" \
            --generate-notes \
            "${extra_args[@]}"
