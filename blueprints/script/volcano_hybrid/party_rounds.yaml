blueprint:
  name: Volcano party rounds
  description: >-
    Bags for a group at one temperature: heats up, gives you time to fit the
    first bag, then fills a bag every few minutes. Stops after a set number of
    bags and turns the Volcano off, so it can't run on unattended. The
    temperature is in °C, also on a °F setup.
  domain: script
  author: magikh0e
  source_url: https://github.com/SavageNL/home-assistant-volcano-hybrid/blob/main/blueprints/script/volcano_hybrid/party_rounds.yaml
  input:
    volcano:
      name: Volcano
      description: The Volcano's thermostat entity.
      selector:
        entity:
          filter:
            - integration: volcano_hybrid
              domain: climate
    temperature:
      name: Temperature
      default: 190
      selector:
        number:
          min: 40
          max: 230
          unit_of_measurement: °C
    bags:
      name: Bags
      default: 8
      selector:
        number:
          min: 1
          max: 20
    gap_minutes:
      name: Time between bags
      description: Minutes to pass the bag round and fit the next one.
      default: 2.5
      selector:
        number:
          min: 0.5
          max: 15
          step: 0.5
          unit_of_measurement: min
    fill_seconds:
      name: Fill time
      default: 40
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: s
mode: single
variables:
  volcano_entity: !input volcano
  celsius: !input temperature
  bags: !input bags
  gap_minutes: !input gap_minutes
  fill_seconds: !input fill_seconds
  # Climate temperatures are in the instance's unit system; the Volcano's
  # 230 °C maximum shows as 446 °F.
  fahrenheit: "{{ state_attr(volcano_entity, 'max_temp') | float(0) > 300 }}"
  target: >-
    {{ ((celsius | float * 9 / 5 + 32) | round(1)) if fahrenheit
    else celsius | float }}
  margin: "{{ 1.8 if fahrenheit else 1 }}"
sequence:
  - action: climate.set_temperature
    data:
      temperature: "{{ target }}"
    target:
      entity_id: "{{ volcano_entity }}"
  - action: climate.turn_on
    target:
      entity_id: "{{ volcano_entity }}"
  - alias: Wait for heatup
    wait_template: >-
      {{ state_attr(volcano_entity, 'current_temperature') | float(0)
      >= target | float - margin | float }}
    timeout: "00:15:00"
    continue_on_timeout: true
  - if: "{{ not wait.completed }}"
    then:
      - action: climate.turn_off
        target:
          entity_id: "{{ volcano_entity }}"
      - stop: "Didn't heat up within 15 minutes"
        error: true
  - alias: Time to fit the first bag
    delay:
      seconds: 30
  - repeat:
      count: "{{ bags | int }}"
      sequence:
        - action: climate.set_fan_mode
          data:
            fan_mode: "on"
          target:
            entity_id: "{{ volcano_entity }}"
        - alias: Fill the bag
          delay:
            seconds: "{{ fill_seconds | int }}"
        - action: climate.set_fan_mode
          data:
            fan_mode: "off"
          target:
            entity_id: "{{ volcano_entity }}"
        - if: "{{ repeat.index < bags | int }}"
          then:
            - alias: Pass it round, fit the next bag
              delay:
                seconds: "{{ (gap_minutes | float * 60) | int }}"
  - action: climate.turn_off
    target:
      entity_id: "{{ volcano_entity }}"
