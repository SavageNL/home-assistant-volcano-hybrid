wait_for_temperature:
  target:
    entity:
      integration: volcano_hybrid
      domain: climate
  fields:
    temperature:
      selector:
        number:
          min: 0
          max: 500
          step: 1
          mode: box
    turn_on:
      default: false
      selector:
        boolean:
    tolerance:
      default: 0
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          mode: box
    timeout:
      default:
        minutes: 15
      selector:
        duration:
